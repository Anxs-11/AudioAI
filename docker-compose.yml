version: "3.9"

services:
  backend:
    build: ./backend
    container_name: voice-analyzer-backend
    environment:
      - SECRET_KEY=change-this-to-a-secure-random-string
      - ADMIN_USERNAME=autoace
      - ADMIN_PASSWORD=autoace2024
      - WHISPER_MODEL_SIZE=base
      - DATABASE_URL=sqlite+aiosqlite:////app/data/voice_analyzer.db
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: voice-analyzer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-db:
